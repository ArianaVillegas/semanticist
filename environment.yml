name: semanticist
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.0
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - scikit-image
  - matplotlib
  - pillow
  - opencv
  - pip
  - pip:
    - accelerate
    - diffusers[torch]
    - transformers
    - safetensors
    - omegaconf
    - tensorboard
    - huggingface-hub
    - einops
    - timm
    - git+https://github.com/LTH14/torch-fidelity.git@master#egg=torch-fidelity
    - torchmetrics
    - submitit
    - gradio
